name: CI Backend

on:
  push:
    branches: [main]
    paths:
      - 'app/backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/backend/**'
      - '.github/workflows/ci-backend.yml'

defaults:
  run:
    working-directory: app/backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medical_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/backend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Charger le schéma SQL
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d medical_app_test -f src/config/schema.sql
        env:
          PGPASSWORD: postgres

      - name: Lancer les tests
        run: npm test --if-present
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: medical_app_test
          JWT_SECRET: ci_test_secret

      - name: Build de l'image Docker
        run: docker build -t medical-app-backend:ci .

apiVersion: v1
data:
  schema.sql: |
    -- Schéma de base pour la table patients
    -- IMPORTANT : ce projet est un portfolio DevOps — n'y insérer que des données FICTIVES.

    CREATE EXTENSION IF NOT EXISTS pgcrypto;

    CREATE TABLE IF NOT EXISTS patients (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        first_name VARCHAR(100) NOT NULL,
        last_name VARCHAR(100) NOT NULL,
        date_of_birth DATE NOT NULL,
        gender VARCHAR(20),
        phone VARCHAR(30),
        email VARCHAR(150),
        blood_type VARCHAR(5),
        allergies TEXT,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE INDEX IF NOT EXISTS idx_patients_last_name ON patients (last_name);

    -- Table utilisateurs pour l'authentification (staff médical)
    CREATE TABLE IF NOT EXISTS users (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        username VARCHAR(50) UNIQUE NOT NULL,
        password_hash VARCHAR(255) NOT NULL,
        role VARCHAR(20) NOT NULL DEFAULT 'staff',
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
kind: ConfigMap
metadata:
  name: postgres-init-schema
  namespace: medical-app
